  <details class="yp-demo-controls"><summary>演示设置与计时说明</summary><div id="yp-demo-actions" class="yp-actions"></div><p>所有公司名称、集团关系、人员及保护状态均为模拟。演示按登记时刻起算、下一天计第1天；正式日界口径待确认。本次日期限定11—12月，不跨春节、国庆；正式版需排除这两个假期的完整放假区间。</p><p>“重置”只恢复本演示的模拟状态。真实表格不读取、不写入、不删除；模拟中作废的业务记录也会保留。</p></details>
  <script>
  (()=>{
    /* MODEL_START */
    const DemoModel=(()=>{
      const DAY=86400000,NOW=Date.parse('2026-11-17T10:00:00+08:00'),ME='销售甲';
      const ts=s=>Date.parse(s+'T10:00:00+08:00');
      const companies=[
        {id:'c1',name:'示例甲（华东）食品有限公司',city:'上海',industry:'食品制造',group:'示例甲集团',words:'示例甲 示例甲可乐 sample-a',existing:true},
        {id:'c2',name:'示例甲（华南）饮料有限公司',city:'广州',industry:'饮料制造',group:'示例甲集团',words:'示例甲 示例甲可乐 sample-a',existing:false},
        {id:'c3',name:'示例乙（华东）食品有限公司',city:'苏州',industry:'食品制造',group:'示例乙集团',words:'示例乙 sample-b',existing:true},
        {id:'c4',name:'示例丙食品科技有限公司',city:'杭州',industry:'食品研发',group:null,words:'示例丙',existing:true},
        {id:'c5',name:'示例丁饮品有限公司',city:'成都',industry:'饮料制造',group:null,words:'示例丁 新企业',existing:false},
        {id:'c6',name:'示例戊食品有限公司',city:'宁波',industry:'食品制造',group:null,words:'示例戊',existing:true},
        {id:'c7',name:'示例己乳业有限公司',city:'青岛',industry:'乳品制造',group:null,words:'示例己',existing:true},
        {id:'c8',name:'示例庚食品有限公司',city:'长沙',industry:'食品制造',group:null,words:'示例庚 保护',existing:true,annual:'销售丙'}
      ];
      const company=id=>companies.find(c=>c.id===id);
      const dayKey=t=>new Date(t+8*3600000).toISOString().slice(0,10);
      function addDays(t,n,holidays=[]){let d=t,count=0;while(count<n){d+=DAY;if(!holidays.some(([a,b])=>dayKey(d)>=a&&dayKey(d)<=b))count++;}return d;}
      function norm(v){const x=v.trim().replace(/[\s　·，,。/\\_-]/g,'').toLowerCase();return ({'采购':'采购部','采购部门':'采购部','市场':'市场部','市场部门':'市场部','研发':'研发部','研发部门':'研发部'})[x]||x;}
      function scope(cid,dept){const c=company(cid);return c?(c.group?'g:'+c.group+':'+norm(dept):'c:'+cid):cid;}
      function seed(){return {v:2,serial:20,role:'sales',page:'claim',filter:'active',adminFilter:'pending',query:'示例甲',selected:null,dept:'',panel:null,flash:null,race:false,approvalRace:false,created:[],records:[
        {id:'r1',cid:'c1',dept:'市场部',owner:ME,start:ts('2026-11-10'),firstEnd:ts('2026-11-24'),end:ts('2026-11-24'),void:false,second:false,logs:['11/10 10:00 · 销售甲登记首次保护']},
        {id:'r2',cid:'c4',dept:'',owner:ME,start:ts('2026-11-02'),firstEnd:ts('2026-11-16'),end:ts('2026-11-16'),void:false,second:false,logs:['11/02 10:00 · 销售甲登记首次保护','11/16 10:00 · 首次保护到期']},
        {id:'r3',cid:'c6',dept:'',owner:ME,start:ts('2026-11-07'),firstEnd:ts('2026-11-21'),end:ts('2026-11-21'),void:false,second:false,logs:['11/07 10:00 · 销售甲登记首次保护']},
        {id:'r4',cid:'c1',dept:'采购部',owner:'销售丙',start:ts('2026-11-13'),firstEnd:ts('2026-11-27'),end:ts('2026-11-27'),void:false,second:false,logs:[]},
        {id:'r5',cid:'c3',dept:'研发部',owner:'销售丁',start:ts('2026-11-09'),firstEnd:ts('2026-11-23'),end:ts('2026-11-23'),void:false,second:false,logs:['11/09 10:00 · 销售丁登记首次保护']},
        {id:'r6',cid:'c7',dept:'',owner:'销售戊',start:ts('2026-11-01'),firstEnd:ts('2026-11-15'),end:ts('2026-11-15'),void:false,second:false,logs:['11/15 10:00 · 首次保护到期']},
        {id:'r7',cid:'c3',dept:'市场部',owner:ME,start:ts('2026-10-30'),firstEnd:ts('2026-11-13'),end:ts('2026-11-13'),void:true,second:false,logs:['11/03 10:00 · 销售甲作废：部门填写错误']}
      ],requests:[
        {id:'q1',rid:'r5',reason:'已完成需求沟通，本周安排样品评估，申请继续跟进。',at:ts('2026-11-16'),status:'pending'},
        {id:'q2',rid:'r6',reason:'客户已重新启动项目，明天进行预算确认，希望恢复保护。',at:ts('2026-11-16'),status:'pending'}
      ]};}
      const active=(r,now=NOW)=>!r.void&&r.end>now;
      const count=(s,owner=ME)=>s.records.filter(r=>r.owner===owner&&active(r)).length;
      const pending=(s,rid)=>s.requests.find(q=>q.rid===rid&&q.status==='pending');
      function conflict(s,cid,dept,exclude){return s.records.find(r=>r.id!==exclude&&active(r)&&scope(r.cid,r.dept)===scope(cid,dept));}
      function eligible(s,cid,dept,owner=ME,exclude){const c=company(cid);if(!c)return '请先选择准确公司';if(c.group&&!dept.trim())return '请填写要保护的部门';if(c.annual)return '该公司属于2026年度保护，归属'+c.annual;if(conflict(s,cid,dept,exclude))return '该保护范围已被占用';const base=s.records.filter(r=>r.id!==exclude&&r.owner===owner&&active(r)).length;if(base>=15)return '有效黄区已满15条';return '';}
      const newID=(s,p)=>p+(++s.serial);
      function claim(s,cid,dept){const c=company(cid);let err=eligible(s,cid,dept);if(err)return {error:err};if(s.race){s.race=false;const end=addDays(NOW,14);s.records.push({id:newID(s,'r'),cid,dept:c.group?dept.trim():'',owner:'销售丙',start:NOW,firstEnd:end,end,void:false,second:false,logs:['11/17 10:00 · 销售丙先提交成功']});return {error:'提交时销售丙先登记成功，当前范围已被占用。你的名额未扣减。'};}
        if(!c.existing&&!s.created.some(x=>x.name===c.name))s.created.push({name:c.name});
        const end=addDays(NOW,14),r={id:newID(s,'r'),cid,dept:c.group?dept.trim():'',owner:ME,start:NOW,firstEnd:end,end,void:false,second:false,logs:['11/17 10:00 · 销售甲登记首次保护']};s.records.unshift(r);return {record:r};}
      function request(s,rid,reason){const r=s.records.find(x=>x.id===rid);if(!r||r.owner!==ME||r.void)return {error:'这条记录不能申请续保'};if(r.second)return {error:'本次黄区已使用二次保护'};if(pending(s,rid))return {error:'已有待审批申请，请勿重复提交'};if(!reason.trim())return {error:'请填写申请原因'};const q={id:newID(s,'q'),rid,reason:reason.trim(),at:NOW,status:'pending'};s.requests.unshift(q);r.logs.push('11/17 10:00 · 销售甲申请二次保护');return {request:q};}
      function approvalBlock(s,q){const r=s.records.find(x=>x.id===q.rid);if(!r||r.void)return '原黄区已作废';if(r.second)return '已使用二次保护';return eligible(s,r.cid,r.dept,r.owner,r.id);}
      function decide(s,qid,approved,note){if(s.role!=='manager')return {error:'仅销售管理员可以审批'};const q=s.requests.find(x=>x.id===qid);if(!q||q.status!=='pending')return {error:'申请已处理，请勿重复操作'};const r=s.records.find(x=>x.id===q.rid);if(!approved&&!note.trim())return {error:'驳回时请填写原因'};
        if(approved){if(s.approvalRace&&!active(r)){s.approvalRace=false;const end=addDays(NOW,14);s.records.push({id:newID(s,'r'),cid:r.cid,dept:r.dept,owner:'销售丙',start:NOW,firstEnd:end,end,void:false,second:false,logs:[]});}const err=approvalBlock(s,q);if(err)return {error:err+'，未批准；申请继续待处理。'};q.from=active(r)?r.end:NOW;q.until=addDays(q.from,14);q.rule=active(r)?'接原到期日':'从批准生效时起';q.oldEnd=r.end;r.end=q.until;r.second=true;r.logs.push('11/17 10:00 · 审批员乙批准二次保护（'+q.rule+'）');}
        else r.logs.push('11/17 10:00 · 审批员乙驳回二次保护：'+note.trim());q.status=approved?'approved':'rejected';q.note=note.trim();q.decided=NOW;return {request:q,record:r};}

      else if(a==='withdraw'){const out=M.withdraw(s,id);if(out.error)flash(out.error,true);else {flash('已撤回续保申请，首次保护期限不变。');s.panel=null;s.filter='active';}}
      else if(a==='approve'||a==='reject'){const out=M.decide(s,id,a==='approve',root.querySelector('#yp-approval-note').value);if(out.error)flash(out.error,true);else flash(a==='approve'?'已批准，销售端的到期日已同步更新。':'已驳回，意见已同步给销售。');}
      else if(a==='void'){const out=M.voidRecord(s,id,root.querySelector('#yp-void-reason').value);if(out.error){root.querySelector('#yp-form-error').textContent=out.error;return;}flash('已作废并解除占用，记录保留在历史中。');}
      else if(a==='demo-quota'){M.fillQuota(s);flash('已加入模拟占位记录，销售甲当前15/15。');}
      else if(a==='demo-race'){s.race=!s.race;flash(s.race?'下次有效登记将模拟被他人抢先。':'已关闭抢单冲突模拟。');}
      else if(a==='demo-approval-race'){s.approvalRace=!s.approvalRace;flash(s.approvalRace?'下次批准已过期续保时，将模拟被他人占用。':'已关闭审批冲突模拟。');}
      else if(a==='reset'){s=M.seed();draft='';}
      render();if(a==='select-company'){(root.querySelector('#yp-dept')||root.querySelector('[data-action=claim]'))?.focus();}persist();
    });
    render();
  })();
  </script>
</div>
</body></html>
